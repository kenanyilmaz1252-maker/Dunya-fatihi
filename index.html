    if(wo.length&&Math.random()<0.6){const o=wo[Math.floor(Math.random()*wo.length)];if(E[o].army<E[me].army||Math.random()<0.3){peaceDlg(o);return}}
    if(ai.length&&Math.random()<0.6){const who=ai[Math.floor(Math.random()*ai.length)];if(Math.random()<0.5)askDlg(who,[30,50,80,100][Math.floor(Math.random()*4)]);else askDlg(who,[20,40,60][Math.floor(Math.random()*3)],'army')}else if(Math.random()<0.4)eventDlg()};
  if(lost.length)lossDlg(lost,nextAsk);else nextAsk();
}
function peaceDlg(o){
  $('dt').textContent=T[o].name+' barış istiyor';
  $('dp').textContent='Savaşı bitirmeyi teklif ediyor. Kabul edersen iki taraf da saldırmayı bırakır.';
  const y=$('dy'),n=$('dn');y.textContent='Barışı kabul et';y.disabled=false;n.hidden=false;n.textContent='Savaşa devam';
  const end=m=>{$('dlg').hidden=true;say(m);ui();saveGame()};
  y.onclick=()=>{delete war[rk(me,o)];setR(me,o,R(me,o)+15);SFX.peace();end('Barış yapıldı.')};
  n.onclick=()=>{setR(me,o,R(me,o)-5);end(T[o].name+' teklifin reddedilmesine bozuldu.')};
  $('dlg').hidden=false;
}
function lossDlg(list,next){
  $('dt').textContent='Toprağımız alındı!';
  $('dp').innerHTML=list.map(([i,n,cap,tn])=>cap?'<b>'+T[i].name+'</b>, başkenti <b>'+n+'</b> şehrini ele geçirdi!':'<b>'+T[i].name+'</b>, <b>'+n+'</b> şehrini ele geçirdi.').join('<br>')+(over?'<br>Tüm topraklarını kaybettin.':'');
  const y=$('dy'),n=$('dn');y.textContent='Tamam';y.disabled=false;n.hidden=true;
  y.onclick=()=>{$('dlg').hidden=true;n.hidden=false;ui();saveGame();next&&next()};
  $('dlg').hidden=false;
}
function eventDlg(){
  const al=E.map((e,i)=>i).filter(i=>i!==me&&sovereign(i));if(!al.length)return;
  const p=al[Math.floor(Math.random()*al.length)];
  const ev=[
   {t:'Kıtlık',d:'Halk aç kalıyor. Tahıl dağıtmak 60 altına mal olur.',
    a:['Tahıl dağıt (60 altın)',()=>{E[me].gold-=60;E[me].army+=10;return 'Halk sevindi, 10 gönüllü orduya katıldı.'},()=>E[me].gold>=60],
    b:['Aldırma',()=>{E[me].army*=0.9;return 'Aç kalan askerlerin %10\'u ordudan ayrıldı.'}]},
   {t:'Ayaklanma',d:'Bir şehirde isyan çıktı.',
    a:['Ordu gönder (30 asker)',()=>{E[me].army-=30;return 'İsyan bastırıldı.'},()=>E[me].army>=30],
    b:['Görmezden gel',()=>{E[me].gold*=0.85;return 'İsyan hazineyi vurdu, altının %15\'i gitti.'}]},
   {t:'Altın bulundu',d:'Topraklarında yeni bir altın madeni keşfedildi.',
    a:['Kendin işlet (+120 altın)',()=>{E[me].gold+=120;return '120 altın kazandın.'}],
    b:[T[p].name+'\'e kirala (+60 altın)',()=>{E[me].gold+=60;setR(me,p,R(me,p)+10);return T[p].name+' ile ilişkiniz düzeldi.'}]},
   {t:T[p].name+' ticaret öneriyor',d:'Karşılıklı bir ticaret anlaşması teklif ediyor.',
    a:['Kabul et (+80 altın)',()=>{E[me].gold+=80;setR(me,p,R(me,p)+15);return 'Anlaşma imzalandı.'}],
    b:['Reddet',()=>{setR(me,p,R(me,p)-5);return T[p].name+' teklifin reddedilmesine bozuldu.'}]},
   {t:'Salgın',d:'Ordu kamplarında salgın başladı. Karantina 50 altına mal olur.',
    a:['Karantina (50 altın)',()=>{E[me].gold-=50;return 'Salgın kontrol altına alındı.'},()=>E[me].gold>=50],
    b:['Devam et',()=>{E[me].army*=0.8;return 'Ordunun %20\'si hastalandı.'}]}
  ];
  const e=ev[Math.floor(Math.random()*ev.length)];
  $('dt').textContent=e.t;$('dp').textContent=e.d;
  const y=$('dy'),n=$('dn');n.hidden=false;
  y.textContent=e.a[0];y.disabled=e.a[2]?!e.a[2]():false;n.textContent=e.b[0];
  const done=f=>{$('dlg').hidden=true;say(f());ui();saveGame()};
  y.onclick=()=>done(e.a[1]);n.onclick=()=>done(e.b[1]);
  $('dlg').hidden=false;
}
function askDlg(i,amt,kind='gold'){
  const army=kind==='army',unit=army?'asker':'altın',have=Math.floor(E[me][kind]);
  $('dt').textContent=T[i].name+(army?' askeri yardım istiyor':' yardım istiyor');
  $('dp').textContent=amt+' '+unit+' talep ediyor. Şu an '+have+' '+(army?'askerin':'altının')+' var. Reddedersen ilişkiniz bozulur, bu da sana saldırmalarına yol açabilir.';
  const y=$('dy'),n=$('dn');y.textContent='Ver ('+amt+')';y.disabled=have<amt;n.textContent='Vermiyorum';
  const end=m=>{$('dlg').hidden=true;say(m);ui();saveGame()};
  y.onclick=()=>{E[me][kind]-=amt;E[i][kind]+=amt;setR(me,i,R(me,i)+20);end(T[i].name+' teşekkür etti.')};
  n.onclick=()=>{setR(me,i,R(me,i)-15);end(T[i].name+' reddedilmeye kızdı.')};
  $('dlg').hidden=false;
}
$('bAsk').onclick=()=>{if(selC==null)return;const o=C[selC].owner,amt=50,r=R(me,o);
  if(r>=10&&E[o].gold>=amt&&Math.random()<0.5+r/200){E[o].gold-=amt;E[me].gold+=amt;setR(me,o,r-10);say(T[o].name+' sana '+amt+' altın verdi.');SFX.coin()}
  else{setR(me,o,r-5);say(T[o].name+' isteğini reddetti.')}ui()};
$('bArmy').onclick=()=>{if(selC==null)return;const o=C[selC].owner,amt=40,r=R(me,o);
  if(r>=10&&E[o].army>=amt*2&&Math.random()<0.4+r/200){E[o].army-=amt;E[me].army+=amt;setR(me,o,r-8);say(T[o].name+' sana '+amt+' asker gönderdi.')}
  else{setR(me,o,r-5);say(T[o].name+' askeri yardım isteğini reddetti.')}ui()};
$('bGift').onclick=()=>{if(selC==null)return;const o=C[selC].owner;E[me].gold-=50;E[o].gold+=50;setR(me,o,R(me,o)+15);say(T[o].name+' hediyeni kabul etti.');ui()};
$('bAtk').onclick=()=>{if(selC==null)return;const c=C[selC],o=c.owner;
  if(ally[rk(me,o)]){say('Müttefikine saldıramazsın. Önce ittifakı boz.');return}
  if(!war[rk(me,o)]){declareWar(me,o);say(T[o].name+' ülkesine savaş ilan ettin!');SFX.war();ui();return}
  const r=attackCity(me,selC);
  SFX[r==='cap'?'capital':r?'win':'fail']();
  if(r==='cap')say(c.name+' başkenti ele geçirildi! Ganimet: +60 altın.');else if(r)say(c.name+' şehri ele geçirildi.');else say('Saldırı püskürtüldü.');
  if(owned(me).length===C.length){over=true;say('Dünya senin! Tebrikler.');SFX.winGame()}ui();draw()};
$('bAlly').onclick=()=>{if(selC==null)return;const o=C[selC].owner,k=rk(me,o),r=R(me,o);
  if(ally[k]){delete ally[k];setR(me,o,r-15);say('İttifak bozuldu.')}
  else if(war[k])say('Savaştayken ittifak kurulmaz.');
  else if(r>=25&&Math.random()<0.5+r/200){ally[k]=1;setR(me,o,r+10);say(T[o].name+' ittifak teklifini kabul etti.');SFX.peace()}
  else{setR(me,o,r-3);say(T[o].name+' ittifak teklifini reddetti.')}ui()};
$('bPeace').onclick=()=>{if(selC==null)return;const o=C[selC].owner,k=rk(me,o);if(!war[k])return;
  if(E[o].army<E[me].army*1.3||Math.random()<0.3){delete war[k];setR(me,o,R(me,o)+10);say('Barış yapıldı.');SFX.peace()}
  else say(T[o].name+' barışı reddetti.');ui()};
$('bCity').onclick=()=>{if(sel==null)return;const cs=T[sel].cities;selC=cs[(cs.indexOf(selC)+1)%cs.length];ui();draw()};
$('bRec').onclick=()=>{E[me].gold-=50;E[me].army+=40;SFX.coin();ui()};
$('bEnd').onclick=endTurn;

// camera
let s=3,ox=0,oy=0;
function resize(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;draw()}
function fit(){s=minS()*1.8;ox=innerWidth/2-20*s;oy=(46+innerHeight-150)/2+35*s;clamp()}
function minS(){return Math.max(innerWidth/360,(innerHeight-196)/143)}
function clamp(){s=Math.min(Math.max(s,minS()),40);
  ox=Math.max(Math.min(ox,180*s),innerWidth-180*s);
  oy=Math.max(Math.min(oy,46+85*s),innerHeight-150-58*s)}
function draw(){
  if(!E.length)return;const r=devicePixelRatio||1;
  ctx.setTransform(r,0,0,r,0,0);ctx.clearRect(0,0,innerWidth,innerHeight);
  const dark=matchMedia('(prefers-color-scheme:dark)').matches&&document.documentElement.dataset.theme!=='light'||document.documentElement.dataset.theme==='dark';
  const L=dark?34:62;
  const path=p=>{ctx.beginPath();p.forEach((v,k)=>{const x=ox+v[0]*s,y=oy-v[1]*s;k?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath()};
  const vis=c=>!(ox+c.bb[2]*s<0||ox+c.bb[0]*s>innerWidth||oy-c.bb[1]*s<0||oy-c.bb[3]*s>innerHeight);
  for(const t of TD)for(const id of t.cities){const c=C[id];if(!vis(c))continue;path(c.p);ctx.fillStyle=col(c.owner,L);ctx.fill();ctx.lineWidth=.6;ctx.strokeStyle=dark?'#0006':'#fff8';ctx.stroke()}
  for(const t of TD){path(t.p);ctx.lineWidth=1.3;ctx.strokeStyle=dark?'#000c':'#000a';ctx.stroke()}
  if(selC!=null){path(C[selC].p);ctx.lineWidth=3;ctx.strokeStyle='#e8b400';ctx.stroke()}
  for(const c of C){if(!(s>9||c.id===selC))continue;const x=ox+c.x*s,y=oy-c.y*s;if(x<-40||y<-20||x>innerWidth+40||y>innerHeight+20)continue;
    ctx.fillStyle=dark?'#fff':'#111';ctx.textAlign='center';ctx.font=(c.cap?'bold ':'')+'11px Georgia';ctx.fillText(c.name,x,y+4)}
  ctx.fillStyle=dark?'#fff':'#111';ctx.textAlign='center';ctx.font='12px Georgia';
  for(const t of T){const px=ox+t.cx*s,py=oy-t.cy*s;
    if(s>10||t.pow>=4||s>5.5&&t.pow>=2){ctx.fillText(t.name,px,py+4)}}
}
function hit(px,py){const lon=(px-ox)/s,lat=(oy-py)/s;
  for(let k=TD.length-1;k>=0;k--){const t=TD[k];if(lon<t.bb[0]||lon>t.bb[2]||lat<t.bb[1]||lat>t.bb[3])continue;
    for(const id of t.cities)if(inside(C[id].p,lon,lat))return id}
  let best=null,bd=14;
  for(const c of C)for(const v of c.p){const d=Math.hypot(ox+v[0]*s-px,oy-v[1]*s-py);if(d<bd){bd=d;best=c.id}}
  return best}
const ptr=new Map();let moved=0,lastD=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);moved=0;lastD=0});
cv.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;const o=ptr.get(e.pointerId);
  const n=[e.clientX,e.clientY];
  if(ptr.size===1){ox+=n[0]-o[0];oy+=n[1]-o[1];moved+=Math.abs(n[0]-o[0])+Math.abs(n[1]-o[1])}
  else if(ptr.size===2){ptr.set(e.pointerId,n);const [a,b]=[...ptr.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);
    if(lastD){zoomAt((a[0]+b[0])/2,(a[1]+b[1])/2,d/lastD)}lastD=d;moved+=20;draw();return}
  ptr.set(e.pointerId,n);clamp();draw()});
const up=e=>{if(ptr.size===1&&moved<10&&E.length){const cid=hit(e.clientX,e.clientY);if(cid==null){sel=null;selC=null}else{selC=cid;sel=C[cid].t}
    ui();draw();SFX.tap()}
  ptr.delete(e.pointerId);lastD=0};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',e=>{ptr.delete(e.pointerId);lastD=0});
function zoomAt(x,y,f){const ns=Math.min(Math.max(s*f,minS()),40);f=ns/s;ox=x-(x-ox)*f;oy=y-(y-oy)*f;s=ns;clamp()}
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.15:0.87);draw()},{passive:false});
$('zi').onclick=()=>{zoomAt(innerWidth/2,innerHeight/2,1.4);draw()};
$('zo').onclick=()=>{zoomAt(innerWidth/2,innerHeight/2,0.7);draw()};
addEventListener('resize',()=>{clamp();resize()});
function buildList(){
  $('pick').hidden=false;$('list').hidden=false;$('pick').textContent=scn.name+' · ülkeni seç';$('list').innerHTML='';
  const str=i=>T.filter(x=>x.owner===i).reduce((s,x)=>s+x.pow,0);
  T.filter(t=>t.owner===t.id).sort((a,b)=>str(b.id)-str(a.id)).slice(0,24).forEach(t=>{
    const b=document.createElement('button');
    b.innerHTML=`<span>${t.name}</span><span style="width:14px;height:14px;background:${col(t.id,55)};border:1px solid var(--line)"></span>`;
    b.onclick=()=>startGame(t.id);$('list').appendChild(b)});
}
SCN.forEach(s=>{const b=document.createElement('button');b.innerHTML=`<b>${s.name}</b><small>${s.sub}</small>`;
  b.onclick=()=>{applyScn(s);[...$('eras').children].forEach(x=>x.classList.remove('on'));b.classList.add('on');buildList()};$('eras').appendChild(b)});
const KEY='dunya-fatihi-kayitlar',OLD='dunya-fatihi-kayit';
let gid=null;
function validSave(d){return d&&d.id&&d.own&&d.own.length===T.length&&d.E&&d.E.length===T.length&&SCN.some(x=>x.id===d.scn)}
function readSaves(){try{const a=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(a)?a.filter(validSave):[]}catch(e){return []}}
function writeSaves(a){try{localStorage.setItem(KEY,JSON.stringify(a));return true}catch(e){return false}}
function saveGame(msg,asNew){if(!E.length)return;
  if(asNew||!gid)gid='g'+Date.now()+Math.floor(Math.random()*1000);
  const d={id:gid,scn:scn.id,me,year,over,moves,own:T.map(t=>t.owner),cown:C.map(c=>c.owner),E,rel,war,ally,ts:Date.now()};
  const a=readSaves(),i=a.findIndex(x=>x.id===gid);
  if(i>=0)a[i]=d;else{a.push(d);if(a.length>12)a.shift()}
  const ok=writeSaves(a);
  if(msg)say(ok?(asNew?'Yeni kayıt oluşturuldu.':'Oyun kaydedildi.'):'Kaydedilemedi: tarayıcı kayda izin vermiyor.')}
function loadGame(id){const d=readSaves().find(x=>x.id===id);if(!d)return;
  applyScn(SCN.find(x=>x.id===d.scn));
  T.forEach((t,i)=>{t.owner=d.own[i]});C.forEach(c=>c.owner=T[c.t].owner);
  if(d.cown&&d.cown.length===C.length)C.forEach((c,i)=>{c.owner=d.cown[i]});
  E=d.E;me=d.me;year=d.year;over=d.over;moves=d.moves==null?5:d.moves;rel=d.rel;war=d.war;ally=d.ally;gid=d.id;sel=null;selC=null;
  $('dlg').hidden=true;$('menu').hidden=true;fit();say('Kayıt yüklendi.');ui();draw()}
function refreshSaves(){const box=$('saves');box.innerHTML='';
  const a=readSaves().sort((x,y)=>y.ts-x.ts);
  a.forEach(d=>{const row=document.createElement('div');row.className='srow';
    const c=document.createElement('button');c.className='main';const dt=new Date(d.ts);
    c.textContent=T[d.me].name+' · '+SCN.find(x=>x.id===d.scn).name+' · Yıl '+d.year+' · '+dt.toLocaleDateString('tr-TR',{day:'numeric',month:'short'})+' '+dt.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
    c.onclick=()=>loadGame(d.id);
    const x=document.createElement('button');x.textContent='Sil';let arm=0;
    x.onclick=()=>{if(!arm){arm=1;x.textContent='Emin misin?';setTimeout(()=>{arm=0;x.textContent='Sil'},4000);return}
      writeSaves(readSaves().filter(s=>s.id!==d.id));refreshSaves()};
    row.append(c,x);box.appendChild(row)});
  $('savesT').hidden=!a.length}
$('bSave').onclick=()=>saveGame(true);
$('bSaveAs').onclick=()=>saveGame(true,true);
$('bMenu').onclick=()=>{saveGame();$('menu').hidden=false;refreshSaves()};
try{const o=JSON.parse(localStorage.getItem(OLD)||'null');
  if(o&&o.own){o.id='eski'+Date.now();o.ts=Date.now();const a=readSaves();a.push(o);if(writeSaves(a))localStorage.removeItem(OLD)}}catch(e){}
refreshSaves();
// ses düğmesi ve genel dinleyiciler
new MutationObserver(()=>{if(!$('dlg').hidden)(($('dt').textContent.includes('Toprağımız'))?SFX.lost:SFX.dialog)()}).observe($('dlg'),{attributes:true,attributeFilter:['hidden']});
document.addEventListener('pointerdown',()=>{if(soundOn){ac();startMusic()}});
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button');if(b&&b.id!=='bSnd'&&b.id!=='bAtk'&&b.id!=='bRec')SFX.tap()});
document.addEventListener('visibilitychange',()=>{if(AC&&document.hidden&&AC.state==='running')AC.suspend().catch(()=>{});else if(AC&&!document.hidden&&soundOn)AC.resume().catch(()=>{})});
$('bSnd').onclick=()=>{soundOn=!soundOn;try{localStorage.setItem('dunya-fatihi-ses',soundOn?'1':'0')}catch(e){}
  sndLabel();if(soundOn){ac();startMusic();SFX.tap()}};
sndLabel();
resize();
</script>
